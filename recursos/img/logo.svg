<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Bella Glam - Owner: Makeup Store">
  <defs>
    <linearGradient id="bg-labial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7ab8"/>
      <stop offset="55%" stop-color="#e8377f"/>
      <stop offset="100%" stop-color="#9c1b57"/>
    </linearGradient>
    <linearGradient id="bg-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0f7"/>
      <stop offset="45%" stop-color="#ffc9e4"/>
      <stop offset="100%" stop-color="#d94f96"/>
    </linearGradient>
    <linearGradient id="bg-texto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e1042"/>
      <stop offset="45%" stop-color="#e0245f"/>
      <stop offset="100%" stop-color="#ff7ab8"/>
    </linearGradient>
    <linearGradient id="bg-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6fa"/>
      <stop offset="100%" stop-color="#ffd9ea"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado del emblema -->
  <rect x="1" y="1" width="62" height="62" rx="20" fill="url(#bg-fondo)" stroke="#f06aa8" stroke-width="2"/>

  <!-- Labial -->
  <g transform="translate(32 33)">
    <!-- bala (parte superior) -->
    <path d="M0 -25 C -7 -19 -9 -12 -9 -6 L 9 -6 C 9 -12 7 -19 0 -25 Z" fill="url(#bg-labial)"/>
    <path d="M-9 -6 L 9 -6 L 8 2 L -8 2 Z" fill="#b81e5e"/>
    <!-- anillo metalico -->
    <rect x="-11" y="2" width="22" height="6" rx="2" fill="url(#bg-metal)" stroke="#d94f96" stroke-width="1"/>
    <!-- base -->
    <path d="M-9 8 L 9 8 L 8 25 L -8 25 Z" fill="url(#bg-metal)" stroke="#d94f96" stroke-width="1"/>
    <rect x="-9" y="20" width="18" height="5" fill="#c94a8c" opacity=".55"/>
  </g>

  <!-- Chispas / destellos -->
  <path d="M52 9 C 52.9 13.4 54.6 15.1 59 16 C 54.6 16.9 52.9 18.6 52 23 C 51.1 18.6 49.4 16.9 45 16 C 49.4 15.1 51.1 13.4 52 9 Z" fill="#ffb84d"/>
  <path d="M14 12 C 14.5 14.7 15.6 15.8 18.3 16.3 C 15.6 16.8 14.5 17.9 14 20.6 C 13.5 17.9 12.4 16.8 9.7 16.3 C 12.4 15.8 13.5 14.7 14 12 Z" fill="#ffd66b"/>

  <!-- Texto: BELLA -->
  <text x="78" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="url(#bg-texto)" letter-spacing="1">BELLA</text>

  <!-- Texto: GLAM -->
  <text x="188" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="none" stroke="#c2185b" stroke-width="1" letter-spacing="1">GLAM</text>

  <!-- Subtítulo -->
  <text x="80" y="55" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#a8326b" letter-spacing="3.4">MAKEUP STORE</text>
</svg>